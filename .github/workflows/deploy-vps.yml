name: Deploy server to VPS

# Manual deploy of the game server to a VPS over SSH.
#
# Credentials come from workflow inputs (quick start) or repository secrets
# (preferred for repeat use): VPS_HOST, VPS_USER, and VPS_SSH_KEY (private
# key) or VPS_PASSWORD. Inputs take precedence over secrets.
#
# The VPS only needs SSH access as a user that can run Docker; Docker is
# installed automatically when missing (Debian/Ubuntu). The image is built
# here and streamed over SSH, so the VPS never needs registry credentials.
# World data persists in the `gc_data` Docker volume.
#
# Afterwards, point the app at http://<host>:<port> (repository variable
# SERVER_URL bakes it into new APKs).

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'VPS host (falls back to VPS_HOST secret)'
        required: false
        default: ''
      user:
        description: 'SSH user (falls back to VPS_USER secret)'
        required: false
        default: ''
      password:
        description: 'SSH password (falls back to VPS_PASSWORD/VPS_SSH_KEY secret; prefer secrets)'
        required: false
        default: ''
      ssh_port:
        description: 'SSH port'
        required: false
        default: '22'
      http_port:
        description: 'Public port for the game server'
        required: false
        default: '8080'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ inputs.host != '' && inputs.host || secrets.VPS_HOST }}
      SSH_USER: ${{ inputs.user != '' && inputs.user || secrets.VPS_USER }}
      SSH_PASSWORD: ${{ inputs.password != '' && inputs.password || secrets.VPS_PASSWORD }}
      SSH_PORT: ${{ inputs.ssh_port != '' && inputs.ssh_port || '22' }}
      HTTP_PORT: ${{ inputs.http_port != '' && inputs.http_port || '8080' }}
    steps:
      - name: Mask credentials in logs
        run: |
          [ -n "$SSH_PASSWORD" ] && echo "::add-mask::$SSH_PASSWORD" || true

      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t dearde-server:latest .

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          if [ -z "$HOST" ] || [ -z "$SSH_USER" ]; then
            echo "No VPS host/user provided (inputs or secrets)." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          if [ -n "$SSH_PASSWORD" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q sshpass
            echo "SSH_CMD=sshpass -e ssh -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$HOST" >> "$GITHUB_ENV"
            echo "SSHPASS=$SSH_PASSWORD" >> "$GITHUB_ENV"
          elif [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "SSH_CMD=ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$HOST" >> "$GITHUB_ENV"
          else
            echo "Provide a password input or VPS_PASSWORD/VPS_SSH_KEY secret." >&2
            exit 1
          fi

      - name: Ensure Docker on the VPS
        run: |
          $SSH_CMD 'command -v docker >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sh)'
          $SSH_CMD 'docker --version'

      - name: Ship image and (re)start the server
        run: |
          echo "Streaming image to $HOST..."
          docker save dearde-server:latest | gzip | $SSH_CMD 'gunzip | docker load'

          echo "Restarting container..."
          $SSH_CMD "
            set -e
            docker volume create gc_data >/dev/null
            docker rm -f galactic-conflict >/dev/null 2>&1 || true
            docker run -d --name galactic-conflict \
              --restart unless-stopped \
              -p ${HTTP_PORT}:8080 \
              -v gc_data:/data \
              dearde-server:latest
          "

      - name: Health check (on the VPS)
        run: |
          for i in $(seq 1 10); do
            if $SSH_CMD "curl -fsS http://localhost:${HTTP_PORT}/health"; then
              echo
              echo "Server responds locally."
              exit 0
            fi
            sleep 3
          done
          echo "Server did not become healthy; container logs:"
          $SSH_CMD 'docker logs --tail 50 galactic-conflict' || true
          exit 1

      - name: Health check (public, from the runner)
        run: |
          for i in $(seq 1 5); do
            if curl -fsS -m 10 "http://$HOST:${HTTP_PORT}/health"; then
              echo
              echo "Publicly reachable: http://$HOST:${HTTP_PORT}"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Server runs, but http://$HOST:${HTTP_PORT} is not reachable from the internet — check the VPS firewall for port ${HTTP_PORT}."
