name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  game-core:
    name: game_core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/game_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  server:
    name: server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  samen:
    name: samen tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5
          cache: true

      # Also resolve the sub-packages: `flutter analyze` covers the whole
      # repository, including server/ and packages/game_core.
      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/game_core && dart pub get)
          (cd server && dart pub get)

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Set the repository variable SERVER_URL (Settings → Secrets and
      # variables → Actions → Variables) to bake your galaxy's address into
      # the APK, so the start screen comes pre-filled.
      - name: Build release APK
        run: flutter build apk --release --dart-define=SERVER_URL=${{ vars.SERVER_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: galactic-conflict-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  server-image:
    name: Publish server image
    runs-on: ubuntu-latest
    needs: [game-core, server]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dearde-server:latest
            ghcr.io/${{ github.repository_owner }}/dearde-server:${{ github.sha }}
