<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe3d3">
<title>Samen 💞</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The font loads alongside; the page shows straight away and swaps it in. -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="modulepreload" href="vendor/three.module.min.js">
<style>
  :root {
    --text: #3d2b52; --muted: #8b7a9e; --card: rgba(255, 255, 255, .78);
    --mini: #ff6f91; --mini-dark: #e2456c; --maxi: #ffb84d; --maxi-dark: #e8932a;
    --floor: #fff7ec; --floor-edge: #f1e2cf; --wall: #8a6cc2; --wall-dark: #6a4ea3;
    --pa: #ff5fa2; --pb: #3cb4ff; --pc: #9b6bff; --pd: #2fc46b; --heart: #ff4d6d; --crate: #c98b52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(165deg, #ffe3d3 0%, #f8dcff 50%, #d9e9ff 100%) fixed;
    color: var(--text); display: flex; justify-content: center; padding: 14px 16px 28px;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
  .hidden { display: none !important; }
  .card { background: var(--card); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(120, 80, 160, .15); }
  .muted { color: var(--muted); }
  .center { text-align: center; }

  /* Title with the two characters */
  .hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
  .hero h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: .5px; }
  .hero h1 span:first-child { color: var(--mini-dark); } .hero h1 span:last-child { color: var(--maxi-dark); }
  .duo { display: flex; align-items: flex-end; gap: 10px; height: 74px; }
  .duo .heart { font-size: 1.4rem; margin-bottom: 30px; animation: float 2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }

  /* Characters (also used on the board) */
  .char { position: relative; display: grid; place-items: center; }
  .char .face { position: absolute; inset: 0; }
  .char .face::before, .char .face::after { content: ''; position: absolute; top: 38%; width: 12%; height: 14%; background: #3d2b52; border-radius: 50%; }
  .char .face::before { left: 30%; } .char .face::after { right: 30%; }
  .char .smile { position: absolute; left: 38%; right: 38%; top: 58%; height: 12%; border-bottom: 3px solid #3d2b52; border-radius: 0 0 50% 50%; }
  .char .cheek { position: absolute; top: 56%; width: 12%; height: 8%; background: rgba(255, 90, 120, .35); border-radius: 50%; }
  .char .cheek.l { left: 16%; } .char .cheek.r { right: 16%; }
  .char.mini { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb3c4, var(--mini)); box-shadow: 0 3px 0 var(--mini-dark); }
  .char.maxi { border-radius: 26%; background: radial-gradient(circle at 35% 25%, #ffe2a8, var(--maxi)); box-shadow: 0 3px 0 var(--maxi-dark); }
  .duo .char.mini { width: 44px; height: 44px; animation: hop 1.6s ease-in-out infinite; }
  .duo .char.maxi { width: 66px; height: 70px; animation: hop 1.6s .3s ease-in-out infinite; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

  /* Inputs and buttons */
  input {
    width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--floor-edge);
    background: #fff; color: var(--text); font: inherit; font-size: 1.1rem; user-select: text;
  }
  input:focus { outline: none; border-color: var(--mini); }
  #codeInput { text-transform: uppercase; letter-spacing: 6px; font-weight: 700; text-align: center; font-size: 1.4rem; }
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  .btn {
    width: 100%; padding: 16px; border-radius: 18px; font-size: 1.2rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--mini), #ff9a6b); box-shadow: 0 5px 0 var(--mini-dark);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--mini-dark); }
  .btn.alt { background: linear-gradient(135deg, var(--maxi), #ffd166); box-shadow: 0 5px 0 var(--maxi-dark); color: #4a3200; }
  .btn.alt:active { box-shadow: 0 1px 0 var(--maxi-dark); }
  .btn.ghost { background: #fff; color: var(--text); box-shadow: 0 4px 0 var(--floor-edge); }
  .link { background: none; color: var(--muted); font-size: 1rem; text-decoration: underline; padding: 6px; }
  .msg { color: #d6336c; text-align: center; min-height: 1.2em; }

  /* Game header */
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .lvl { flex: 1; }
  .topbar .lvl small { color: var(--muted); display: block; font-size: .85rem; }
  .topbar .lvl b { font-size: 1.25rem; }
  .iconbtn { width: 46px; height: 46px; border-radius: 50%; background: #fff; font-size: 1.3rem; box-shadow: 0 3px 0 var(--floor-edge); }
  .stars { display: flex; gap: 4px; justify-content: center; }
  .stars span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.7); }
  .stars span.done { background: var(--heart); } .stars span.now { background: var(--maxi); }

  .tip { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(120, 80, 160, .12); }
  .tip .char { flex-shrink: 0; }
  .tip .char.mini { width: 34px; height: 34px; } .tip .char.maxi { width: 38px; height: 42px; }
  .tip p { font-size: 1.05rem; line-height: 1.3; }
  .tip p b { display: block; font-size: .85rem; color: var(--muted); font-weight: 600; }
  .hintbtn { align-self: center; padding: 10px 22px; border-radius: 999px; background: #fff; color: var(--text); font-size: 1rem; font-weight: 600; box-shadow: 0 3px 0 var(--floor-edge); }
  .hintbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--floor-edge); }
  #tips.compact { flex-direction: row !important; }
  #tips.compact .tip { flex: 1; padding: 8px 10px; gap: 8px; align-items: flex-start; }
  #tips.compact .tip p { font-size: .85rem; } #tips.compact .tip p b { display: none; }
  #tips.compact .char.mini { width: 24px; height: 24px; } #tips.compact .char.maxi { width: 26px; height: 30px; }

  /* Board */
  .board-wrap { position: relative; touch-action: none; }
  .board3d { width: 100%; aspect-ratio: 1 / .8; }
  .board3d canvas { width: 100%; height: 100%; display: block; }
  .board { position: relative; display: grid; gap: 0; background: var(--wall-dark); border-radius: 18px; padding: 6px; touch-action: none; box-shadow: 0 10px 24px rgba(90, 60, 140, .3); }
  .tile { aspect-ratio: 1; position: relative; }
  .tile.ice { background: #d6edff; box-shadow: inset 0 0 0 1px #b9dcf7; }
  .tile.water { background: #4aa8e0; }
  .tile.bridge { background: #b07a45; box-shadow: inset 0 0 0 2px #8f5d30; }
  .tile.cracked { background: var(--floor); background-image: linear-gradient(35deg, transparent 46%, #8a6d55 47% 50%, transparent 51%); }
  .tile.lever::after { content: '🕹️'; position: absolute; inset: 0; display: grid; place-items: center; font-size: min(4vw, 18px); }
  .tile.lever.on::after { filter: hue-rotate(90deg); }
  .tile.gate { background: repeating-linear-gradient(90deg, #8d8fa3 0 3px, transparent 3px 8px), var(--floor); }
  .tile.key::after { content: '🔑'; position: absolute; inset: 0; display: grid; place-items: center; font-size: min(4vw, 18px); }
  .tile.lock { background: #9a7a5a; }
  .tile.lock::after { content: '🔒'; position: absolute; inset: 0; display: grid; place-items: center; font-size: min(4vw, 18px); }
  .tile.floor, .tile.exit, .tile.plate, .tile.door.open, .tile.gate.open, .tile.lever, .tile.key, .tile.lock.open { background: var(--floor); box-shadow: inset 0 0 0 1px var(--floor-edge); }
  .tile.wall { background: linear-gradient(160deg, var(--wall), var(--wall-dark)); border-radius: 6px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.2); transform: scale(.94); }
  .tile.tunnel { background: linear-gradient(160deg, var(--wall), var(--wall-dark)); border-radius: 6px; transform: scale(.94); }
  .tile.tunnel::after { content: ''; position: absolute; left: 20%; right: 20%; top: 28%; bottom: 0; background: #3b2a55; border-radius: 50% 50% 0 0; }
  .tile.plate::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; background: var(--pc-color); box-shadow: 0 3px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.5); }
  .tile.plate.pressed::after { transform: translateY(2px); box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
  .tile.door { background: var(--pc-color); border-radius: 4px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.15); background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 4px, transparent 4px 10px); }
  .tile.door::after { content: '🔒'; position: absolute; inset: 0; display: grid; place-items: center; font-size: min(4vw, 18px); }
  .tile.door.open { background-image: none; }
  .tile.door.open::after { content: ''; inset: 8%; border: 3px dashed var(--pc-color); border-radius: 4px; }
  .tile.exit::after { content: '❤'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--heart); font-size: min(6vw, 30px); animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(.85); } 20% { transform: scale(1.05); } }

  .sprite { position: absolute; transition: left .15s ease-out, top .15s ease-out; pointer-events: none; display: grid; place-items: center; z-index: 2; }
  .sprite .char.mini { width: 62%; height: 62%; }
  .sprite .char.maxi { width: 86%; height: 90%; }
  .sprite.me::before { content: '▼'; position: absolute; top: -48%; font-size: 12px; color: var(--text); animation: float 1s ease-in-out infinite; }
  .sprite.crate .box { width: 84%; height: 84%; border-radius: 6px; background: var(--crate); box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), 0 3px 0 #8f5d30; background-image: linear-gradient(45deg, transparent 44%, rgba(0,0,0,.2) 45% 55%, transparent 56%), linear-gradient(-45deg, transparent 44%, rgba(0,0,0,.2) 45% 55%, transparent 56%); }
  .sprite.bump .char { animation: bump .25s; }
  @keyframes bump { 25% { transform: translateX(-8%); } 75% { transform: translateX(8%); } }
  .sprite.step .char { animation: squash .15s; }
  @keyframes squash { 50% { transform: scale(1.1, .9); } }

  .overlay { position: absolute; inset: 0; background: rgba(255, 247, 236, .92); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 5; animation: pop .35s; }
  .overlay .big { font-size: 1.8rem; font-weight: 700; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }

  /* D-pad */
  .controls { display: flex; gap: 14px; justify-content: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(3, 66px); gap: 6px; }
  .pad button {
    display: grid; place-items: center; border-radius: 50%; background: #fff; font-size: 1.6rem; color: var(--pad-color);
    box-shadow: 0 5px 0 var(--pad-dark); transition: transform .06s, box-shadow .06s;
  }
  .pad button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pad-dark); background: var(--pad-color); color: #fff; }
  .pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 3; }
  .pad .label { grid-column: 2; grid-row: 2; display: grid; place-items: center; }
  .pad .label .char.mini { width: 30px; height: 30px; } .pad .label .char.maxi { width: 34px; height: 38px; }
  /* Isometric board: the arrows point where the character walks on screen. */
  .pad.iso .up { grid-column: 3; grid-row: 1; } .pad.iso .right { grid-column: 3; grid-row: 3; }
  .pad.iso .down { grid-column: 1; grid-row: 3; } .pad.iso .left { grid-column: 1; grid-row: 1; }
  .controls.local .pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
  .controls.local .pad button svg { width: 22px; height: 22px; }

  .qr { background: #fff; border-radius: 18px; padding: 12px; width: 210px; height: 210px; margin: 0 auto; box-shadow: 0 4px 14px rgba(120, 80, 160, .15); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .code { font-size: 2rem; font-weight: 700; letter-spacing: 8px; text-align: center; }
  .waitdots::after { content: '…'; animation: dots 1.2s steps(3) infinite; display: inline-block; overflow: hidden; vertical-align: bottom; width: 1ch; }
  @keyframes dots { from { width: 0; } to { width: 1.2ch; } }

  /* Each zone of the world has its own sky. */
  body { transition: background 1.2s; }
  body[data-zone="ijs"] { background: linear-gradient(165deg, #e8f4ff 0%, #dfe8ff 50%, #f2f7ff 100%) fixed; }
  body[data-zone="grot"] { background: linear-gradient(165deg, #f3e6da 0%, #e9dcef 50%, #dcd3e6 100%) fixed; }
  body[data-zone="meer"] { background: linear-gradient(165deg, #dff4ff 0%, #e2f6ef 50%, #fff3dc 100%) fixed; }
  body[data-zone="kasteel"] { background: linear-gradient(165deg, #ece6f6 0%, #e3dcef 50%, #f5ecf3 100%) fixed; }
  body[data-zone="hart"] { background: linear-gradient(165deg, #ffe0ea 0%, #ffd6e8 50%, #ffe9dc 100%) fixed; }

  .banner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(255,255,255,.92); border-radius: 999px;
    padding: 8px 18px; text-align: center; box-shadow: 0 6px 18px rgba(120,80,160,.2); pointer-events: none; z-index: 4;
    opacity: 0; transition: opacity .5s; white-space: nowrap; }
  .banner.show { opacity: 1; }
  .banner small { display: block; color: var(--muted); font-size: .8rem; }
  .banner b { font-size: 1.1rem; }
  .keys { position: absolute; right: 10px; bottom: 10px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 12px; font-weight: 700; z-index: 4; }
  .continue { background: linear-gradient(135deg, #fff, #fff6fa); border: 2px solid var(--mini); }
  .seats { display: flex; gap: 10px; } .seats > * { flex: 1; }

  /* 2D fallback for the mushroom-kingdom tiles */
  .tile.pipe { background: var(--floor); }
  .tile.pipe::after { content: ''; position: absolute; inset: 12%; border-radius: 50%; background: radial-gradient(circle, #0d2a12 45%, var(--pipe) 47%); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .tile.brick { background: #d9772f; background-image: linear-gradient(#5a2d12 2px, transparent 2px), linear-gradient(90deg, #5a2d12 2px, transparent 2px); background-size: 50% 50%; border-radius: 3px; }
  .tile.spring::after { content: ''; position: absolute; inset: 22%; border-radius: 30%; background: repeating-linear-gradient(0deg, #e8423a 0 3px, #c9ccd8 3px 6px); }
  .tile.coin::after { content: ''; position: absolute; inset: 28% 34%; border-radius: 50%; background: #ffc928; box-shadow: inset -2px 0 0 #d99a10; animation: beat 1.2s ease-in-out infinite; }
  .tile.star { background: #ffd34d; border-radius: 4px; }
  .tile.star::after { content: '⭐'; position: absolute; inset: 0; display: grid; place-items: center; font-size: min(4vw, 18px); }
  .tile.star.open { background: var(--floor); } .tile.star.open::after { opacity: .3; }
  .tile.pswitch::after { content: 'P'; position: absolute; inset: 16%; border-radius: 6px; background: #2f6fe0; color: #fff; font-weight: 700; display: grid; place-items: center; font-size: min(3.5vw, 16px); }
  .tile.pblock { background: #4aa8e0; }
  .tile.pblock::after { content: ''; position: absolute; inset: 10%; border: 2px dashed #2f6fe0; border-radius: 4px; }
  .tile.pblock.on { background: #5a92ff; } .tile.pblock.on::after { border-style: solid; border-color: #fff; }
  .tile.stair { background-image: repeating-linear-gradient(90deg, transparent 0 30%, rgba(0,0,0,.12) 30% 33%); }
  .tile.pipe, .tile.spring, .tile.coin, .tile.pswitch { box-shadow: inset 0 0 0 1px var(--floor-edge); background-color: var(--floor); }

  /* Bosses */
  .bossbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; background: rgba(255,255,255,.92); border-radius: 18px;
    padding: 6px 14px; text-align: center; box-shadow: 0 6px 18px rgba(120,80,160,.2); white-space: nowrap; }
  .bossbar b { font-size: 1rem; } .bossbar .lives { color: #ff4d6d; letter-spacing: 2px; margin-left: 6px; }
  .bossbar small { display: block; color: var(--muted); font-size: .8rem; }
  .bossbar.hit { animation: shake .4s; }
  @keyframes shake { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
  .tile.trap { background-color: var(--floor); } .tile.trap::after { content: '🌸'; position: absolute; inset: 0; display: grid; place-items: center; font-size: min(4vw, 18px); }
  .tile.deep { background: #2f5fa8; }
  .tile.crumble { background: #a8835c; box-shadow: inset 0 0 0 2px #7a5a3a; }
  .tile.hole { background: #140d22; border-radius: 50%; }
  .tile.cage { background: var(--floor); background-image: repeating-linear-gradient(90deg, #f5c242 0 3px, transparent 3px 9px); }
  .tile.cage.open { background-image: none; }
  .sprite.boss .face { font-size: min(7vw, 30px); line-height: 1; }

  /* Start area picker */
  .pickbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; border-radius: 16px; background: #fff; color: var(--text); text-align: left; box-shadow: 0 3px 0 var(--floor-edge); }
  .pickbtn span { color: var(--muted); font-size: .9rem; } .pickbtn b { flex: 1; font-weight: 600; } .pickbtn i { font-style: normal; color: var(--muted); }
  .picker { display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow-y: auto; padding: 2px; }
  .picker small { color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
  .picker .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .chip { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #fff; color: var(--text); font-size: .95rem; text-align: left; box-shadow: 0 2px 0 var(--floor-edge); }
  .chip b { display: grid; place-items: center; min-width: 26px; height: 26px; border-radius: 50%; background: var(--floor-edge); font-size: .85rem; }
  .chip.sel { background: var(--mini); color: #fff; box-shadow: 0 2px 0 var(--mini-dark); } .chip.sel b { background: rgba(255,255,255,.3); }
  body[data-zone="berg"] { background: linear-gradient(165deg, #dcecff 0%, #eef3fb 50%, #e3f0e6 100%) fixed; }
  body[data-zone="paddo"] { background: linear-gradient(165deg, #cdeeff 0%, #e6f7ff 50%, #fff4d6 100%) fixed; }

  /* Phone held sideways: the world fills the screen and the joypads float
     over it, one in each corner when you play together on one phone. */
  @media (orientation: landscape) and (max-height: 540px) {
    body.playing { padding: 0; overflow: hidden; }
    body.playing .app { max-width: none; }
    body.playing #game { position: fixed; inset: 0; }
    body.playing .board-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    body.playing .board3d { width: 100%; height: 100%; aspect-ratio: auto; }
    body.playing .board { height: calc(100% - 16px); width: auto; max-width: 62%; }
    body.playing .topbar { position: fixed; top: 8px; left: 10px; right: 10px; z-index: 6; pointer-events: none; }
    body.playing .topbar > * { pointer-events: auto; }
    body.playing .topbar .lvl { flex: 0 1 auto; margin: 0 auto; background: rgba(255,255,255,.85); border-radius: 999px; padding: 4px 16px; }
    body.playing .topbar .lvl b { font-size: 1rem; } body.playing .topbar .lvl small { font-size: .75rem; }
    body.playing .iconbtn { width: 40px; height: 40px; font-size: 1.1rem; }
    body.playing .stars, body.playing #footHint { display: none; }
    body.playing #tips { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: min(54vw, 520px); z-index: 6; align-items: center; }
    body.playing .keys { top: 58px; right: 12px; bottom: auto; }
    body.playing .bossbar { top: 58px; bottom: auto; left: 12px; transform: none; text-align: left; }
    body.playing .banner { top: 56px; }
    body.playing .controls { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    body.playing .pad { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right)); pointer-events: auto;
      grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; }
    body.playing .controls.local .pad:first-child { right: auto; left: max(16px, env(safe-area-inset-left)); }
    body.playing .controls.local .pad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
    body.playing .pad button { background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    body.playing .pad .label { opacity: .85; }
    body.playing #gameMsg { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 6; }
  }

  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 3px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="app">

  <div class="hero" id="hero">
    <div class="duo">
      <div class="char mini"><div class="face"></div><div class="smile"></div><div class="cheek l"></div><div class="cheek r"></div></div>
      <div class="heart">💞</div>
      <div class="char maxi"><div class="face"></div><div class="smile"></div><div class="cheek l"></div><div class="cheek r"></div></div>
    </div>
    <h1><span>Sa</span><span>men</span></h1>
  </div>

  <!-- Start screen -->
  <section id="continueBox" class="card continue hidden center">
    <p style="font-size:1.1rem">Welkom terug! 💞</p>
    <p id="continueText" class="muted"></p>
    <button class="btn" id="continueBtn">▶ Verder spelen</button>
  </section>
  <section id="lobby" class="card">
    <p class="center" style="font-size:1.1rem">Twee vriendjes, één doel:<br><b>samen bij het hartje komen</b> ❤</p>
    <input id="nameInput" maxlength="20" placeholder="Hoe heet je?" autocomplete="nickname">
    <button class="pickbtn" id="pickBtn"><span>Begin bij</span><b id="pickText"></b><i>▾</i></button>
    <div id="picker" class="picker hidden"></div>
    <button class="btn" id="createBtn">💞 Start een spel</button>
    <button class="btn ghost" id="showCodeBtn">Ik heb een code</button>
    <div id="codeBox" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off">
      <button class="btn alt" id="joinBtn">Meedoen</button>
    </div>
    <button class="link" id="localBtn">Liever samen op één telefoon?</button>
    <div class="msg" id="lobbyMsg"></div>
  </section>

  <!-- Invite screen (opened via QR / link) -->
  <section id="invite" class="card hidden center">
    <p style="font-size:1.3rem"><b id="inviteHost">Iemand</b> wil samen met je spelen! 💞</p>
    <p class="muted">Jij bent <b style="color:var(--maxi-dark)">Maxi</b>: groot en sterk.</p>
    <input id="inviteName" maxlength="20" placeholder="Hoe heet je?" autocomplete="nickname">
    <button class="btn alt" id="inviteBtn">Speel mee!</button>
    <div id="claimBox" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <p>Dit spel loopt al. Wie ben jij?</p>
      <div class="seats" id="seatBtns"></div>
    </div>
    <div class="msg" id="inviteMsg"></div>
  </section>

  <!-- Waiting for the partner -->
  <section id="share" class="card hidden center">
    <p style="font-size:1.25rem"><b>Laat je maatje dit scannen</b></p>
    <p class="muted">Gewoon met de camera van de telefoon</p>
    <div class="qr" id="shareQr"></div>
    <p class="muted">of typ de code</p>
    <div class="code" id="shareCode"></div>
    <button class="btn ghost" id="copyBtn">Stuur de link</button>
    <p class="muted">Wachten op je maatje<span class="waitdots"></span></p>
    <button class="link" id="cancelBtn">Stoppen</button>
  </section>

  <!-- Game -->
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <div class="topbar">
      <button class="iconbtn" id="leaveBtn" aria-label="Stoppen">✕</button>
      <div class="lvl center"><small id="levelNum"></small><b id="levelTitle"></b></div>
      <button class="iconbtn" id="restartBtn" aria-label="Opnieuw">↺</button>
    </div>
    <div class="stars" id="stars"></div>
    <div id="tips" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="board3d hidden" id="board3d"></div>
      <div class="banner" id="banner"><small id="bannerZone"></small><b id="bannerTitle"></b></div>
      <div class="keys hidden" id="keys"></div>
      <div class="bossbar hidden" id="bossbar"></div>
      <div class="overlay hidden" id="overlay"></div>
    </div>
    <div class="controls" id="controls"></div>
    <p class="muted center" id="footHint" style="font-size:.9rem"></p>
    <div class="msg" id="gameMsg"></div>
  </section>
</div>

<script src="world.js"></script>
<script src="game.js"></script>
<script type="module">

(() => {
  const $ = (id) => document.getElementById(id);
  // The 3D world (with its big three.js library) loads in the background, so
  // the start screen works right away.
  let use3d = (() => {
    try {
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
    } catch { return false; }
  })();
  const board3dModule = use3d ? import('./board3d.js') : null;
  let b3 = null, b3Pending = null;
  if (use3d) { $('board').classList.add('hidden'); $('board3d').classList.remove('hidden'); }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const NAMES = ['Mini', 'Maxi'];
  const PLATE = { a: 'var(--pa)', b: 'var(--pb)', c: 'var(--pc)', d: 'var(--pd)' };
  const PIPES = { 1: '#3fbf4f', 2: '#2fa8d8', 3: '#f08a24', 4: '#a46be0' };
  const ARROWS = { up: 0, right: 90, down: 180, left: 270 }; // degrees on screen
  const charHtml = (seat) => `<div class="char ${seat ? 'maxi' : 'mini'}"><div class="face"></div><div class="smile"></div><div class="cheek l"></div><div class="cheek r"></div></div>`;
  const vibrate = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  let mode = null;      // 'online' | 'local'
  let state = null;
  let session = null;   // { code, token }
  let events = null;
  let local = null, localTotal = 0, localFinished = false;
  let renderedLevel = -1;
  let sprites = [];
  let bossSprite = null;
  let bossHits = { level: -1, hits: 0 };
  const BOSS_FACES = { mol: '🐹', pinguin: '🐧', golem: '🗿', inktvis: '🦑', draak: '🐲', spook: '👻', jeti: '🐻‍❄️', dief: '😼' };
  const WEAK = {
    trap: '🌸 Bloemval: druk samen de roze knoppen in',
    crate: '📦 Duw een kist tegen hem aan',
    fall: '🕳️ Lok hem over de krakende vloer',
    water: '💧 Duw een kist op hem in het water',
    collapse: '🌉 Laat de brug onder hem instorten',
    squeeze: '🤝 Sluit hem samen in',
    drop: '⬇️ Laat een kist op hem vallen',
  };
  let lastSolvedKey = null;
  let hintLevel = -1;

  function show(screen) {
    for (const id of ['lobby', 'invite', 'share', 'game']) $(id).classList.toggle('hidden', id !== screen);
    if (screen !== 'lobby') $('continueBox').classList.add('hidden');
    $('hero').classList.toggle('hidden', screen === 'game');
    document.body.classList.toggle('playing', screen === 'game');
    if (b3) b3.resize();
  }

  // ---------- Board ----------
  const board = $('board');

  function buildBoard(g) {
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${g.tiles[0].length}, 1fr)`;
    board.style.aspectRatio = `${g.tiles[0].length} / ${g.tiles.length}`;
    g.tiles.forEach((row, r) => row.forEach((t, c) => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.dataset.r = r; el.dataset.c = c;
      board.appendChild(el);
    }));
    sprites = [];
    const add = (html, cls) => {
      const s = document.createElement('div');
      s.className = 'sprite ' + cls;
      s.innerHTML = html;
      board.appendChild(s);
      return s;
    };
    g.boxes.forEach(() => sprites.push(add('<div class="box"></div>', 'crate')));
    sprites.push(add(charHtml(0), 'p0'), add(charHtml(1), 'p1'));
    bossSprite = g.boss ? add(`<div class="face">${BOSS_FACES[g.boss.look] || '👾'}</div>`, 'boss') : null;
    renderedLevel = g.level;
    hintLevel = -1;
  }

  function place(sprite, [r, c], g) {
    const tile = board.children[r * g.tiles[0].length + c];
    const moved = sprite.dataset.pos && sprite.dataset.pos !== `${r},${c}`;
    sprite.dataset.pos = `${r},${c}`;
    sprite.style.left = tile.offsetLeft + 'px';
    sprite.style.top = tile.offsetTop + 'px';
    sprite.style.width = tile.offsetWidth + 'px';
    sprite.style.height = tile.offsetHeight + 'px';
    if (moved) { sprite.classList.remove('step'); void sprite.offsetWidth; sprite.classList.add('step'); }
  }

  function renderTiles(g) {
    const hilly = g.heights.some((row) => row.some(Boolean));
    const occupied = new Set([...g.boxes.filter(Boolean), ...g.players].map(([r, c]) => `${r},${c}`));
    g.tiles.forEach((row, r) => row.forEach((t, c) => {
      const el = board.children[r * row.length + c];
      let cls = 'tile';
      if (t === '#') cls += ' wall';
      else if (t === 'o') cls += ' tunnel';
      else if (t === 'E') cls += ' exit';
      else if (t === '_') cls += ' ice';
      else if (t === '~') cls += ' water';
      else if (t === '=') cls += ' bridge';
      else if (t === 'x') cls += ' cracked';
      else if (t === 'k') cls += ' key';
      else if (t === 'K' || t === 'K+') cls += ' lock' + (t === 'K+' ? ' open' : '');
      else if (/^[uv][01]$/.test(t)) cls += ' lever' + (t[1] === '1' ? ' on' : '');
      else if (/^[UV][01]$/.test(t)) cls += ' gate' + (t[1] === '1' ? ' open' : '');
      else if (/^[a-d]$/.test(t)) {
        cls += ' plate' + (occupied.has(`${r},${c}`) ? ' pressed' : '');
        el.style.setProperty('--pc-color', PLATE[t]);
      } else if (/^[A-D]\+?$/.test(t)) {
        cls += ' door' + (t.endsWith('+') ? ' open' : '');
        el.style.setProperty('--pc-color', PLATE[t[0].toLowerCase()]);
      } else if (/^[1-4]$/.test(t)) {
        cls += ' pipe';
        el.style.setProperty('--pipe', PIPES[t]);
      } else if (t === 'r') cls += ' brick';
      else if (t === 'j') cls += ' spring';
      else if (t === '*') cls += ' coin';
      else if (t === 'S' || t === 'S+') cls += ' star' + (t === 'S+' ? ' open' : '');
      else if (t === 'p') cls += ' pswitch';
      else if (t === 'q0' || t === 'q1') cls += ' pblock' + (t === 'q1' ? ' on' : '');
      else if (t === '/') cls += ' floor stair';
      else if (t === 'T') cls += ' trap';
      else if (t === '%' || t === 'Q0') cls += ' deep';
      else if (t === 'Q1') cls += ' crumble';
      else if (t === 'h') cls += ' hole';
      else if (t === 'Z' || t === 'Z+') cls += ' cage' + (t === 'Z+' ? ' open' : '');
      else cls += ' floor';
      el.className = cls;
      // Higher ground is lighter, like sunlit plateaus.
      el.style.filter = hilly && t !== '#' ? `brightness(${0.86 + g.heights[r][c] * 0.07})` : '';
    }));
  }

  function render(s) {
    state = s;
    const waiting = mode === 'online' && !s.players[1];
    if (waiting) {
      show('share');
      $('shareCode').textContent = s.code;
      if ($('shareQr').dataset.code !== s.code) {
        $('shareQr').dataset.code = s.code;
        loadScript('vendor/qrcode.js').then(() => {
          const qr = qrcode(0, 'M');
          qr.addData(inviteLink());
          qr.make();
          $('shareQr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
        });
      }
      return;
    }
    if ($('game').classList.contains('hidden')) {
      show('game');
      buildControls();
      renderedLevel = -1;
      if (mode === 'online') vibrate([60, 60, 60]);
    }

    const g = s.game;
    if (g.level !== renderedLevel) {
      announce(g, renderedLevel);
      if (use3d) renderedLevel = g.level;
      hintLevel = -1;
    }
    document.body.dataset.zone = g.zone;
    if (use3d) {
      if (b3) b3.update(g, mode === 'online' ? s.you : -1);
      else if (!b3Pending) {
        b3Pending = board3dModule.then((m) => { b3 = m.createBoard3D($('board3d')); }).catch(() => {
          // No 3D after all: fall back to the flat board.
          use3d = false;
          $('board').classList.remove('hidden');
          $('board3d').classList.add('hidden');
          buildControls();
        }).then(() => { if (state && state.game) render(state); });
      }
    } else {
      if (g.level !== renderedLevel || !board.firstChild) buildBoard(g);
      renderTiles(g);
      g.boxes.forEach((b, i) => { sprites[i].classList.toggle('hidden', !b); if (b) place(sprites[i], b, g); });
      if (bossSprite) {
        bossSprite.classList.toggle('hidden', !g.boss.pos);
        if (g.boss.pos) place(bossSprite, g.boss.pos, g);
      }
      [0, 1].forEach((seat) => {
        const sp = sprites[g.boxes.length + seat];
        place(sp, g.players[seat], g);
        sp.classList.toggle('me', mode === 'online' && s.you === seat);
      });
    }

    $('levelNum').textContent = `${zoneName(g.zone)} · gebied ${g.level + 1} van ${g.levels}`;
    if (mode === 'online') store.set('samen.lastInfo', JSON.stringify({ code: s.code, area: g.level + 1, areas: g.levels, title: g.title, finished: s.finished }));
    $('levelTitle').textContent = g.title;
    const keySeats = mode === 'local' ? [0, 1] : [s.you];
    const keyText = [
      ...keySeats.filter((seat) => g.keys[seat]).map((seat) => `${NAMES[seat]} 🔑×${g.keys[seat]}`),
      g.coins[1] ? `🪙 ${g.coins[0]}/${g.coins[1]}` : '',
      g.ptimer ? `⏱ ${g.ptimer}` : '',
    ].filter(Boolean).join('  ');
    $('keys').textContent = keyText;
    $('keys').classList.toggle('hidden', !keyText);
    renderBoss(g);
    $('stars').innerHTML = Array.from({ length: g.levels }, (_, i) =>
      `<span class="${i < g.level || s.finished ? 'done' : i === g.level ? 'now' : ''}"></span>`).join('');

    // Hints stay hidden until asked for, per level and per phone.
    const seats = mode === 'local' ? [0, 1] : [s.you];
    const showHint = hintLevel === g.level;
    $('tips').classList.toggle('compact', showHint && mode === 'local');
    $('tips').innerHTML = showHint
      ? seats.map((seat) => `<div class="tip">${charHtml(seat)}<p><b>${mode === 'local' ? NAMES[seat] : 'Hint voor ' + NAMES[seat]}</b>${g.tips[seat]}</p></div>`).join('')
      : '<button class="hintbtn" id="hintBtn">💡 Hint</button>';
    $('footHint').textContent = 'Kom samen bij de hartjes ❤';

    const ov = $('overlay');
    if (s.finished) {
      ov.innerHTML = `<div style="font-size:3rem">🏆</div><div class="big">Jullie hebben de hele wereld doorkruist!</div>
        <div class="muted">Alle ${g.levels} gebieden samen gehaald in ${s.totalMoves} stapjes.</div>
        <button class="btn" id="againBtn">Nog een keer spelen</button>`;
      ov.classList.remove('hidden');
      $('againBtn').onclick = () => act('again');
      celebrate('finished', 80);
    } else {
      ov.classList.add('hidden');
      // A solved area flows straight into the next one; just cheer.
      if (g.solved) {
        showBanner('Gelukt, samen! 💞', 'Op naar het volgende gebied');
        celebrate('area' + g.level, 35);
        if (mode === 'local') setTimeout(() => { if (local.solved && local.level === g.level) act('advance'); }, 1800);
      }
    }
  }

  const scripts = {};
  function loadScript(src) {
    return scripts[src] || (scripts[src] = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = reject;
      document.head.appendChild(el);
    }));
  }

  function renderBoss(g) {
    const bar = $('bossbar');
    if (!g.boss) { bar.classList.add('hidden'); return; }
    const b = g.boss;
    if (bossHits.level !== g.level) bossHits = { level: g.level, hits: b.hits };
    if (b.hits > bossHits.hits) {
      bossHits.hits = b.hits;
      vibrate([120, 60, 120]);
      bar.classList.remove('hit'); void bar.offsetWidth; bar.classList.add('hit');
      if (b.hp > 0) showBanner(`Raak! 💥 Nog ${b.hp} te gaan`, Array.isArray(b.weak) ? 'Let op: nu een andere zwakke plek!' : b.name);
      else { showBanner(`${b.name} is verslagen! 🎉`, 'De kooi is open, naar de hartjes!'); celebrate('boss' + g.level, 60); }
    }
    bar.classList.toggle('hidden', b.hp <= 0);
    bar.innerHTML = `<b>${b.name}</b><span class="lives">${'❤'.repeat(Math.max(0, b.hp))}${'♡'.repeat(Math.max(0, b.maxHp - b.hp))}</span><small>${WEAK[b.weakNow] || ''}</small>`;
  }

  function zoneName(id) {
    const z = Samen.ZONES.find((zz) => zz.id === id);
    return z ? z.name : '';
  }

  let bannerTimer = null;
  function showBanner(small, big) {
    $('bannerZone').textContent = small;
    $('bannerTitle').textContent = big;
    $('banner').classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 2600);
  }

  function announce(g, previous) {
    const newZone = previous < 0 || Samen.AREAS[previous].zone !== g.zone;
    setTimeout(() => showBanner(newZone ? zoneName(g.zone) : `Gebied ${g.level + 1}`, g.title), previous < 0 ? 300 : 1500);
  }

  function celebrate(key, count) {
    if (lastSolvedKey === key) return;
    lastSolvedKey = key;
    vibrate([80, 40, 120]);
    const colors = ['#ff6f91', '#ffb84d', '#3cb4ff', '#9b6bff', '#5ee38a'];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
      c.style.animationDelay = Math.random() * .4 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  $('tips').addEventListener('click', (e) => {
    if (!e.target.closest('#hintBtn') || !state || !state.game) return;
    hintLevel = state.game.level;
    render(state);
  });

  window.addEventListener('resize', () => { if (state && state.game && !$('game').classList.contains('hidden')) render(state); });

  function bump(seat) {
    vibrate(20);
    if (use3d) { if (b3) b3.bump(seat); return; }
    const sp = sprites[state.game.boxes.length + seat];
    if (!sp) return;
    sp.classList.remove('bump'); void sp.offsetWidth; sp.classList.add('bump');
  }

  // ---------- Controls ----------
  function buildControls() {
    const ctl = $('controls');
    ctl.innerHTML = '';
    ctl.classList.toggle('local', mode === 'local');
    const seats = mode === 'local' ? [0, 1] : [state.you];
    for (const seat of seats) {
      const pad = document.createElement('div');
      pad.className = 'pad' + (use3d ? ' iso' : '');
      pad.style.setProperty('--pad-color', seat ? 'var(--maxi)' : 'var(--mini)');
      pad.style.setProperty('--pad-dark', seat ? 'var(--maxi-dark)' : 'var(--mini-dark)');
      pad.innerHTML = `<span class="label">${charHtml(seat)}</span>` +
        Object.keys(ARROWS).map((d) => `<button class="${d}" data-dir="${d}" aria-label="${d}"><svg viewBox="0 0 24 24" width="28" height="28" style="transform:rotate(${ARROWS[d] + (use3d ? 45 : 0)}deg)"><path d="M12 2l9 10h-5.5v10h-7V12H3z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>`).join('');
      pad.addEventListener('pointerdown', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        e.preventDefault();
        step(seat, b.dataset.dir);
      });
      ctl.appendChild(pad);
    }
  }

  async function step(seat, dir) {
    if (!state || !state.game || state.finished || state.game.solved) return;
    if (mode === 'local') {
      if (Samen.move(local, seat, dir)) localTotal += 1; else bump(seat);
      renderLocal();
      return;
    }
    try {
      const res = await api(`/api/rooms/${session.code}/move`, { token: session.token, dir });
      if (!res.ok) bump(seat);
    } catch (e) { $('gameMsg').textContent = e.message; }
  }

  document.addEventListener('keydown', (e) => {
    if (!state || $('game').classList.contains('hidden')) return;
    const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    const wasd = { w: 'up', s: 'down', a: 'left', d: 'right' };
    if (mode === 'local') {
      if (wasd[e.key]) step(0, wasd[e.key]);
      else if (keys[e.key]) step(1, keys[e.key]);
      else return;
    } else if (keys[e.key] || wasd[e.key]) step(state.you, keys[e.key] || wasd[e.key]);
    else return;
    e.preventDefault();
  });

  // Swiping on the board moves your own character. On the isometric board
  // the grid axes run diagonally, so a swipe picks the matching quadrant.
  let touchStart = null;
  const wrap = document.querySelector('.board-wrap');
  wrap.addEventListener('pointerdown', (e) => { touchStart = { x: e.clientX, y: e.clientY }; });
  wrap.addEventListener('pointerup', (e) => {
    if (!touchStart || !state || mode !== 'online') return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) <= 24) return;
    const dir = use3d
      ? (dx > 0 ? (dy < 0 ? 'up' : 'right') : (dy > 0 ? 'down' : 'left'))
      : (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    step(state.you, dir);
  });

  // ---------- Online ----------
  async function api(path, body, method = 'POST') {
    const res = await fetch(path, method === 'GET' ? {} : {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Er ging iets mis');
    return data;
  }

  function act(action) {
    if (mode === 'local') {
      if (action === 'advance') {
        if (local.level + 1 < Samen.AREAS.length) local = Samen.loadLevel(local.level + 1);
        else localFinished = true;
      } else if (action === 'again') { local = Samen.loadLevel(0); localFinished = false; localTotal = 0; lastSolvedKey = null; }
      else if (action === 'restart' && !local.solved) local = Samen.loadLevel(local.level);
      renderLocal();
      return;
    }
    if (action === 'again') lastSolvedKey = null;
    api(`/api/rooms/${session.code}/${action}`, { token: session.token })
      .catch((e) => { $('gameMsg').textContent = e.message; });
  }

  const inviteLink = () => `${location.origin}${location.pathname}?r=${session.code}`;

  function saveName(n) { n = n.trim(); if (n) store.set('samen.name', n); return n; }

  function startOnline(code, token, seat) {
    session = { code, token };
    store.set('samen.room.' + code, token);
    store.set('samen.last', code);
    renderedLevel = -1;
    mode = 'online';
    lastSolvedKey = null;
    history.replaceState(null, '', '?r=' + code);
    state = { you: seat };
    if (events) events.close();
    events = new EventSource(`/api/rooms/${code}/events?token=${encodeURIComponent(token)}`);
    events.onmessage = (e) => render(JSON.parse(e.data));
    events.onerror = () => {
      if (events.readyState === EventSource.CLOSED) $('gameMsg').textContent = 'Verbinding verbroken. Ververs de pagina.';
    };
  }

  async function join(code, name, msgEl, claim) {
    code = code.trim().toUpperCase();
    try {
      if (!/^[A-Z0-9]{4}$/.test(code)) throw new Error('Een code heeft 4 tekens');
      const data = await api(`/api/rooms/${code}/join`, { name, token: store.get('samen.room.' + code), claim });
      startOnline(data.code, data.token, data.seat);
    } catch (e) {
      if (/vol/.test(e.message) && claim === undefined) return offerClaim(code);
      msgEl.textContent = e.message;
    }
  }

  // The game is full and this phone has no seat yet: probably the same
  // person on another phone. Let them pick who they are.
  async function offerClaim(code) {
    show('invite');
    $('inviteBtn').classList.add('hidden');
    $('inviteName').classList.add('hidden');
    try {
      const info = await api(`/api/rooms/${code}`, null, 'GET');
      $('claimBox').classList.remove('hidden');
      $('seatBtns').innerHTML = info.seats.map((p, seat) =>
        `<button class="btn ${seat ? 'alt' : ''}" data-seat="${seat}" ${p.online ? 'disabled' : ''}>${NAMES[seat]}<br><small>${p.name}${p.online ? ' (speelt al)' : ''}</small></button>`).join('');
      $('seatBtns').onclick = (e) => {
        const b = e.target.closest('button');
        if (b && !b.disabled) join(code, '', $('inviteMsg'), Number(b.dataset.seat));
      };
    } catch (e) { $('inviteMsg').textContent = e.message; }
  }

  $('createBtn').onclick = async () => {
    try {
      const data = await api('/api/rooms', { name: saveName($('nameInput').value), start: startLevel });
      startOnline(data.code, data.token, data.seat);
    } catch (e) { $('lobbyMsg').textContent = e.message; }
  };
  $('showCodeBtn').onclick = () => { $('codeBox').classList.remove('hidden'); $('showCodeBtn').classList.add('hidden'); $('codeInput').focus(); };
  $('joinBtn').onclick = () => join($('codeInput').value, saveName($('nameInput').value), $('lobbyMsg'));
  $('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
  $('copyBtn').onclick = async () => {
    const link = inviteLink();
    try {
      if (navigator.share) await navigator.share({ title: 'Samen 💞', text: 'Speel samen met me!', url: link });
      else { await navigator.clipboard.writeText(link); $('copyBtn').textContent = 'Gekopieerd! ✓'; }
    } catch {}
  };

  // ---------- One device ----------
  function renderLocal() {
    store.set('samen.local', JSON.stringify({ game: local, area: Samen.AREAS[local.level].title, total: localTotal, finished: localFinished }));
    render({
      code: '', you: -1, players: [{ name: '' }, { name: '' }],
      game: Samen.view(local), finished: localFinished, totalMoves: localTotal,
    });
  }
  function startLocal(saved) {
    mode = 'local';
    renderedLevel = -1;
    lastSolvedKey = null;
    local = saved ? saved.game : Samen.loadLevel(startLevel);
    localTotal = saved ? saved.total : 0;
    localFinished = saved ? saved.finished : false;
    state = { you: -1 };
    renderLocal();
  }
  $('localBtn').onclick = () => {
    const saved = startLevel === 0 && loadLocal();
    if (saved && saved.game.level > 0 && !saved.finished && confirm(`Verder op één telefoon bij gebied ${saved.game.level + 1}?\n(Annuleren = opnieuw beginnen)`)) startLocal(saved);
    else startLocal(null);
  };
  function loadLocal() {
    try {
      const saved = JSON.parse(store.get('samen.local'));
      if (!saved) return null;
      // Areas come and go between versions: find the saved one back by name,
      // like the server does, or restart near where it was.
      let level = Samen.AREAS.findIndex((a) => a.title === saved.area);
      const known = level >= 0;
      if (!known) level = Math.min(saved.game.level | 0, Samen.AREAS.length - 1);
      if (saved.game.solved) level = Math.min(level + 1, Samen.AREAS.length - 1);
      saved.game = known && !saved.game.solved ? { ...Samen.loadLevel(level), ...saved.game, level } : Samen.loadLevel(level);
      return saved;
    } catch { return null; }
  }

  function leave() {
    if (events) { events.close(); events = null; }
    mode = null; state = null; session = null;
    history.replaceState(null, '', location.pathname);
    show('lobby');
  }
  $('restartBtn').onclick = () => act('restart');
  $('leaveBtn').onclick = () => { if (confirm('Wil je stoppen met spelen?')) leave(); };
  $('cancelBtn').onclick = leave;

  // ---------- Where to start ----------
  let startLevel = 0;
  function renderPicker() {
    const area = Samen.AREAS[startLevel];
    $('pickText').textContent = `${startLevel + 1}. ${area.title}`;
    $('picker').innerHTML = Samen.ZONES.map((z) => {
      const chips = Samen.AREAS.map((a, i) => (a.zone !== z.id ? '' :
        `<button class="chip${i === startLevel ? ' sel' : ''}" data-level="${i}"><b>${i + 1}</b>${a.title}</button>`)).join('');
      return chips && `<div><small>${z.name}</small><div class="chips">${chips}</div></div>`;
    }).join('');
  }
  $('pickBtn').onclick = () => $('picker').classList.toggle('hidden');
  $('picker').onclick = (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    startLevel = Number(b.dataset.level);
    renderPicker();
    $('picker').classList.add('hidden');
  };
  renderPicker();

  // ---------- Boot ----------
  const savedName = store.get('samen.name') || '';
  $('nameInput').value = savedName;
  $('inviteName').value = savedName;
  const invite = (new URLSearchParams(location.search).get('r') || '').toUpperCase();
  if (invite && store.get('samen.room.' + invite)) {
    join(invite, savedName, $('lobbyMsg')); // back after a refresh
  } else if (!invite) {
    // Offer to continue the last online game, if it is still going.
    // What we remember is shown at once; the server then has the last word.
    const last = store.get('samen.last');
    if (last && store.get('samen.room.' + last)) {
      const offer = (info) => {
        const box = $('continueBox');
        if (info.finished) return box.classList.add('hidden');
        $('continueText').textContent = `Jullie waren bij gebied ${info.area} van ${info.areas}: ${info.title}.`;
        box.classList.remove('hidden');
        $('continueBtn').onclick = () => join(last, savedName, $('lobbyMsg'));
      };
      try {
        const known = JSON.parse(store.get('samen.lastInfo'));
        if (known && known.code === last) offer(known);
      } catch {}
      api(`/api/rooms/${last}`, null, 'GET').then(offer).catch(() => $('continueBox').classList.add('hidden'));
    }
  }
  if (invite && !store.get('samen.room.' + invite)) {
    show('invite');
    api(`/api/rooms/${invite}`, null, 'GET').then((info) => {
      if (info.host) $('inviteHost').textContent = info.host;
      if (info.full) offerClaim(invite);
    }).catch((e) => { $('inviteMsg').textContent = e.message; });
    $('inviteBtn').onclick = () => join(invite, saveName($('inviteName').value), $('inviteMsg'));
  }
})();
</script>
</body>
</html>
